<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>.MD Viewer</title>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/mermaid.min.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside id="side">
      <h1>📄 .MD Viewer</h1>
      <div id="rootbar">
        <button id="btnRoot" title="Change folder">📂 <span id="rootName"></span></button>
      </div>
      <div id="tools">
        <input id="search" type="search" placeholder="Search (Ctrl+K)" spellcheck="false" />
        <button id="btnNew" title="New file">＋</button>
      </div>
      <div id="tree"></div>
    </aside>
    <div id="resizer"></div>
    <dialog id="picker">
      <h3>Choose working folder</h3>
      <div class="prow">
        <input id="pickPath" spellcheck="false" placeholder="Paste or type a path and press Enter" />
        <button id="pickGo">Go</button>
      </div>
      <div id="pickList"></div>
      <div id="pickInfo"></div>
      <div class="pbtns">
        <button id="pickCancel">Cancel</button>
        <button id="pickUse" class="primary">Use this folder</button>
      </div>
    </dialog>
    <dialog id="ask">
      <h3 id="askTitle"></h3>
      <input id="askInput" spellcheck="false" />
      <div class="pbtns">
        <button id="askCancel">Cancel</button>
        <button id="askOk" class="primary">OK</button>
      </div>
    </dialog>
    <div id="menu">
      <div id="mRename">Rename</div>
      <div id="mDelete">Delete</div>
    </div>
    <main id="main">
      <div id="bar">
        <span id="title">Choose a file</span>
        <span id="status"></span>
        <button id="btnEdit" disabled>Edit</button>
        <button id="btnSave" class="primary" disabled style="display: none">
          Save (Ctrl+S)
        </button>
        <button id="btnCancel" style="display: none">Cancel</button>
      </div>
      <div id="content">
        <div id="view" class="md">
          <p class="empty">Choose a file from the tree on the left.</p>
        </div>
        <nav id="toc"></nav>
      </div>
      <div id="split">
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="preview" class="md"></div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
